# Sends the daily friends digest, streaming alerts and new-season alerts. Each call only starts the job: the backend answers
# 202 straight away and carries on by itself, logging the result. Needs the repository secret DIGEST_SECRET, matching the backend's
name: Daily friends digest

on:
  schedule:
    # 23:00 UTC, early evening in North America
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend
        # Only needed on a host that sleeps when idle; on an always-on plan this answers at once
        run: curl --silent --retry 5 --retry-delay 10 --max-time 90 https://movie-list-backend-dgct.onrender.com/health
      - name: Send digests
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "x-digest-secret: $DIGEST_SECRET" \
            https://movie-list-backend-dgct.onrender.com/internal/digest
      - name: Send streaming alerts
        # Films on watchlists that just started streaming on someone's services, or come out today
        if: always()
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "x-digest-secret: $DIGEST_SECRET" \
            https://movie-list-backend-dgct.onrender.com/internal/streaming-alerts
      - name: Send new-season alerts
        # A new season of a show in someone's lists starts today
        if: always()
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "x-digest-secret: $DIGEST_SECRET" \
            https://movie-list-backend-dgct.onrender.com/internal/season-alerts
